name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check differential eval tools tests
      - name: Types
        run: mypy differential
      - name: Tests with coverage
        run: pytest -q --cov=differential --cov-fail-under=85
      - name: Evaluation smoke test
        run: python -m eval.run_eval --smoke
