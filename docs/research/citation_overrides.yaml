# Canonical citation fields used when rendering reference lists.
#
# The sources_*.yaml files record HOW each claim was verified during the build
# (often through a GitHub mirror, because the sandbox blocked official hosts).
# This overlay supplies the canonical bibliographic form for the reference list:
# official URLs, DOIs, journal names and clean author lists. Keys not listed here
# render from the source entry as-is. Verification provenance stays in the
# source files and in results/citation_check.json.

