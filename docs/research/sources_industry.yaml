# Differential (PRV 201) — industry, workforce and market evidence base
# Compiled 2026-09-28. Companion synthesis: docs/research/industry_notes.md
#
# Conventions
# - verified: fetched             -> the `url` itself was opened on 2026-09-28 and the quote was read on the page.
# - verified: search_snippet_only -> the `url` was blocked by the sandbox egress proxy (e.g. bls.gov, riaa.com,
#                                    arxiv.org, doi.org, company newsrooms); the quote is taken verbatim from the
#                                    web-search result text for that page. Search summaries sometimes merge several
#                                    outlets; where attribution to one page is uncertain, `notes` says so.
#                                    Re-check these quotes on the live page before final publication.
# - date: "n.d."                  -> no publication/update date was visible to us; nothing was guessed.
# - notes (optional field)        -> verification caveats, related URLs, or reasons to treat a claim with care.
# - Rate cards (type: web, key prefix rates_) are ILLUSTRATIVE single-shop examples, not market averages.

# =====================================================================
# A. WORKFORCE
# =====================================================================

