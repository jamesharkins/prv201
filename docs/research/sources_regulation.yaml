      quote: "Providers and deployers of AI systems shall take measures to support the development of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf"
    - claim: "As replaced, Article 4(1) states that providers and deployers need not guarantee any specific level of AI literacy of any individual."
      quote: "This obligation does not require providers or deployers to guarantee any specific level of AI literacy of any individual."
    - claim: "Recital 8 explains that Article 4 is amended to require providers and deployers to take measures to support AI literacy."
      quote: "Article 4 of Regulation (EU) 2024/1689 should be amended to require providers and deployers to take measures to support the development of AI literacy of their staff"
