  - claim: "The social-scoring ban applies only to governmental entities (§ 552.053)."
    quote: "A governmental entity may not use or deploy an artificial intelligence system that evaluates or classifies a natural person or group of natural persons based on social behavior or personal characteristics"
  - claim: "The ban on AI biometric identification without consent applies only to governmental entities (§ 552.054(b))."
    quote: "A governmental entity may not develop or deploy an artificial intelligence system for the purpose of uniquely identifying a specific individual using biometric data"
  - claim: "The Texas Attorney General has exclusive enforcement authority (§ 552.101(a))."
    quote: "The attorney general has exclusive authority to enforce this chapter, except to the extent provided by Section 552.106."
  - claim: "There is no private right of action (§ 552.101(b))."
    quote: "This chapter does not provide a basis for, and is not subject to, a private right of action for a violation of this chapter or any other law."
  - claim: "After a complaint, the AG's civil investigative demand may ask for the system's performance metrics and known limitations (§ 552.103(b))."
    quote: "(5) any metrics the person uses to evaluate the performance of the artificial intelligence system; (6) any known limitations of the artificial intelligence system;"
  - claim: "The AG must give written notice and may not sue before the 60th day; a cure plus a written statement within that period bars the suit (§ 552.104)."
    quote: "The attorney general may not bring an action against the person: (1) before the 60th day after the date the attorney general provides the notice under Subsection (a)"
  - claim: "Civil penalty for a curable violation: $10,000 to $12,000 (§ 552.105(a)(1))."
    quote: "not less than $10,000 and not more than $12,000"
  - claim: "Civil penalties: $80,000 to $200,000 per uncurable violation; $2,000 to $40,000 per day for a continuing violation (§ 552.105(a)(2)-(3))."
    quote: "(2) for each violation the court determines to be uncurable, not less than $80,000 and not more than $200,000; and (3) for a continued violation, not less than $2,000 and not more than $40,000 for each day the violation continues."
  - claim: "A person is presumed to have used reasonable care (§ 552.105(c))."
    quote: "There is a rebuttable presumption that a person used reasonable care as required under this chapter."
  - claim: "Liability is excluded where the defendant finds the violation through, among other routes, an internal review process while substantially complying with the NIST AI RMF Generative AI Profile or a comparable framework (§ 552.105(e)(2)(D))."
    quote: "if the defendant substantially complies with the most recent version of the \"Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile\" published by the National Institute of Standards and Technology"
  - claim: "No civil-penalty action lies for an AI system that has not been deployed (§ 552.105(f))."
    quote: "The attorney general may not bring an action to collect a civil penalty under this section against a person for an artificial intelligence system that has not been deployed."
  notes: "Third-party Markdown rendering of the codified text; section symbols and headings are the copy's. Every quote here except the history note was also found verbatim in the enrolled-bill extraction (key tx_hb149_enrolled). H.B. 149 also amended Bus. & Com. Code § 503.001 (the existing biometric-identifier statute, whose subsection (b) carries a notice-and-consent rule for commercial capture) and § 541.104 (data-privacy processor duties), and created a regulatory sandbox (ch. 553) and the Texas Artificial Intelligence Council (ch. 554). Section numbers in the claims are read from the copy's headings."

