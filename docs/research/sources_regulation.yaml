      quote: "Official Journal of the European Union EN L series 2026/1744 24.7.2026"
    - claim: "The act enters into force on the third day after publication (24 July 2026 + 3 days = 27 July 2026)."
      quote: "This Regulation shall enter into force on the third day following that of its publication in the Official Journal of the European Union"
