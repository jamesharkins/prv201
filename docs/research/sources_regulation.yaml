- key: eu_ai_act_text_mirror
  type: web
  authors: ["European Parliament", "Council of the European Union"]
  title: "Regulation (EU) 2024/1689 (AI Act): original Official Journal text of the articles and annexes (reproduction, version 2024-08-01)"
  container: "GitHub repository bojkovski-cpu/ai-act-annotated, files src/data/articles_en.json and src/data/annexes_en.json, commit 410bd77 (2026-05-19). Unofficial reproduction of the OJ text, used because EUR-Lex was blocked. It shows the text before the 2026 Omnibus amendments."
  publisher: "GitHub (repository maintained by bojkovski-cpu)"
  date: "2024-07-12"
  url: "https://github.com/bojkovski-cpu/ai-act-annotated"
  accessed: "2026-09-28"
  verified: fetched
  claims:
    - claim: "The AI Act was published in the Official Journal on 12 July 2024 (OJ L, 2024/1689)."
      quote: "(Artificial Intelligence Act) ( OJ L, 2024/1689, 12.7.2024, ELI: http://data.europa.eu/eli/reg/2024/1689/oj )"
    - claim: "As originally adopted, Article 113 made the AI Act generally applicable from 2 August 2026 and applied Chapters I and II from 2 February 2025. Chapter I includes the Article 4 AI-literacy duty and Chapter II the Article 5 prohibitions."
      quote: "It shall apply from 2 August 2026. However: (a) Chapters I and II shall apply from 2 February 2025;"
    - claim: "As originally adopted, Article 113 applied the notified-body, GPAI (Chapter V), governance and penalties provisions from 2 August 2025."
      quote: "(b) Chapter III Section 4, Chapter V, Chapter VII and Chapter XII and Article 78 shall apply from 2 August 2025, with the exception of Article 101;"
    - claim: "As originally adopted, Article 113 applied Article 6(1) (high-risk AI in Annex I products) and its obligations from 2 August 2027."
      quote: "(c) Article 6(1) and the corresponding obligations in this Regulation shall apply from 2 August 2027."
    - claim: "The original Article 4 required providers and deployers to ensure, to their best extent, a sufficient level of AI literacy among their staff."
      quote: "Providers and deployers of AI systems shall take measures to ensure, to their best extent, a sufficient level of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf"
    - claim: "Under Article 6(1), the first condition for high-risk status is that the AI system is a safety component of a product, or is itself a product, covered by Annex I legislation."
      quote: "the AI system is intended to be used as a safety component of a product, or the AI system is itself a product, covered by the Union harmonisation legislation listed in Annex I;"
    - claim: "Under Article 6(1)(b), the second condition is that the product must undergo third-party conformity assessment under that Annex I legislation."
      quote: "the product whose safety component pursuant to point (a) is the AI system, or the AI system itself as a product, is required to undergo a third-party conformity assessment"
    - claim: "Under Article 6(2), the AI systems listed in Annex III are also high-risk."
      quote: "In addition to the high-risk AI systems referred to in paragraph 1, AI systems referred to in Annex III shall be considered to be high-risk."
    - claim: "Article 50(1) requires providers to design AI systems that interact directly with people so that those people are told they are interacting with an AI system, unless this is obvious."
      quote: "Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system, unless this is obvious"
    - claim: "Article 50(2) requires providers of systems that generate synthetic audio, image, video or text to mark the outputs in a machine-readable, detectable way."
      quote: "Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated."
    - claim: "The Article 50(2) marking duty does not apply to assistive editing functions, or where the system does not substantially alter the deployer's input."
      quote: "This obligation shall not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially alter the input data provided by the deployer or the semantics thereof"
    - claim: "As published in 2024, Annex I lists 20 Union harmonisation acts: items 1-12 in Section A (New Legislative Framework, with item 6 the Radio Equipment Directive 2014/53/EU) and items 13-20 in Section B. Full-text inspection found that the Low Voltage Directive 2014/35/EU is absent, and the EMC Directive 2014/30/EU appears only inside the title of item 20."
      quote: "Section A. List of Union harmonisation legislation based on the New Legislative Framework"
    - claim: "Annex III lists eight high-risk areas: biometrics; critical infrastructure; education; employment; essential services; law enforcement; migration and border control; and justice and democratic processes. Full-text inspection found no area covering equipment repair or diagnostics."
      quote: "High-risk AI systems pursuant to Article 6(2) are the AI systems listed in any of the following areas:"
    - claim: "Annex III point 4(b) covers AI used in employment relationships to monitor and evaluate workers' performance and behaviour."
      quote: "to allocate tasks based on individual behaviour or personal traits or characteristics or to monitor and evaluate the performance and behaviour of persons in such relationships."

