- key: mn_325e72_digital_fair_repair
  type: statute
  authors: ["Minnesota Legislature"]
  title: "Minn. Stat. § 325E.72, Digital Fair Repair (the \"Digital Fair Repair Act\")"
  container: "Minnesota Statutes. Read in a copy of the Revisor's page for § 325E.72 scraped from www.revisor.mn.gov and committed to GitHub repo piers109uk/json-lawgic on 14-16 Nov 2024 (data/default/000036371.json, commit 222771b), i.e. the statute text current in Nov 2024. Official text: https://www.revisor.mn.gov/statutes/cite/325E.72 (blocked here). The copy drops subdivision numbers and the History line."
  publisher: "Minnesota Office of the Revisor of Statutes"
  date: "2023"
  url: "https://raw.githubusercontent.com/piers109uk/json-lawgic/222771bcd8031308fe9e514724876a55fba84bda/data/default/000036371.json"
  accessed: "2026-09-29"
  verified: fetched
  claims:
  - claim: "The Act applies to equipment sold on or after 1 July 2021. The statute says 'sold'; it does not say 'sold or in use'."
    quote: "This section applies to equipment sold on or after July 1, 2021."
  - claim: "The core duty covers digital electronic equipment and parts sold or used in Minnesota: the manufacturer must make documentation, parts and tools available to independent repair providers and owners on fair and reasonable terms."
    quote: "For digital electronic equipment and parts for the equipment sold or used in Minnesota, an original equipment manufacturer must make available to any independent repair provider or to the owner"
  - claim: "Parts, tools and documentation must be available within 60 days after the product's first sale in Minnesota."
    quote: "Such parts, tools, and documentation shall be made available within 60 days after the first sale of the digital electronic equipment in Minnesota."
  - claim: "Covered 'digital electronic equipment' is hardware that depends, at least in part, on embedded or attached digital electronics in order to function."
    quote: "means any hardware product that depends, in whole or in part, on digital electronics embedded in or attached to the product in order for the product to function,"
  - claim: "The definition is limited to products for which the manufacturer supplies tools, parts or documentation to authorized repair providers."
    quote: "for which the original equipment manufacturer makes available tools, parts, or documentation to authorized repair providers."
  - claim: "Exclusion: motor vehicle manufacturers, manufacturers of motor vehicle equipment and motor vehicle dealers (and, per the next clause, their products and services)."
    quote: "Nothing in this section applies to: (1) a motor vehicle manufacturer, manufacturer of motor vehicle equipment, or motor vehicle dealer acting in that capacity"
  - claim: "Exclusion: manufacturers and distributors of medical devices as defined in the Federal Food, Drug, and Cosmetic Act."
    quote: "Nothing in this section applies to manufacturers or distributors of a medical device as defined in the Federal Food, Drug, and Cosmetic Act"
  - claim: "The medical exclusion also covers digital electronic products or software made for use in a medical setting."
    quote: "or a digital electronic product or software manufactured for use in a medical setting including diagnostic, monitoring, or control equipment"
  - claim: "Exclusion: off-road and nonroad equipment, including farm and utility tractors, farm implements and farm machinery."
    quote: "Nothing in this section applies to manufacturers, distributors, importers, or dealers of any off-road or nonroad equipment, including without limitation farm and utility tractors; farm implements; farm machinery;"
  - claim: "Exclusion: manufacturers need not supply parts, tools or documentation for the repair of video game consoles."
    quote: "Nothing in this section shall be construed to require any original equipment manufacturer or authorized repair provider to make available any parts, tools, or documentation required for the diagnosis, maintenance, or repair of a video game console"
  - claim: "Exclusion: energy storage systems."
    quote: "Nothing in this section applies to an energy storage system, as defined in section 216B.2422, subdivision 1, paragraph (f)."
  - claim: "Exclusion: information technology equipment intended for use in critical infrastructure."
    quote: "Nothing in this section applies to information technology equipment that is intended for use in critical infrastructure, as defined in United States Code, title 42, section 5195c(e)."
  - claim: "Cybersecurity-related parts, documentation and tools need be supplied only as necessary for repair or maintenance."
    quote: "Nothing in this section requires an original equipment manufacturer to make available parts, documentation, or tools related to cybersecurity, except as necessary for the repair or maintenance of equipment."
  - claim: "A violation is an unlawful practice under § 325D.44, and the Attorney General enforces it with the remedies of § 8.31."
    quote: "A violation of this section is an unlawful practice under section 325D.44. All remedies, penalties, and authority granted to the attorney general under section 8.31 are available to the attorney general to enforce this section."
  - claim: "Manufacturers and authorized repair providers are not liable for damage or injury resulting from repair, diagnosis, maintenance or modification done by others (the sentence continues: by an independent repair provider or owner)."
    quote: "No original equipment manufacturer or authorized repair provider shall be liable for any damage or injury caused to any digital electronic equipment, person, or property that occurs as a result of repair, diagnosis, maintenance, or modification"
  notes: "'Sold or in use' was not found in any official text reached. 'Used' appears only in the geographic scope ('sold or used in Minnesota'); the date limit is 'sold on or after July 1, 2021'. The AG's page (existing key mn_ag_r2r, search snippet) says the same and adds 'Used products are included.' The off-road list also names forestry, industrial, utility and construction equipment, EV-charging equipment, mining equipment, turf/yard/garden and outdoor power equipment, portable generators, marine and recreational vehicles, engines, generator sets and power tools. Subdivision numbers are not in the copy. Do not cite 'subd. N' without checking the Revisor page. Currency: 2025-2026 bills SF 2484/HF 2519 (motorcycles) and HF 970/SF 2030 (farm equipment) proposed amending 'Minnesota Statutes 2024, section 325E.72' (search text). Whether any was enacted was not verified, so re-check the official page before submission."

