- key: ca_ab316_2025_chaptered
  type: statute
  authors: ["California State Legislature"]
  title: "Assembly Bill No. 316 (Krell), Artificial intelligence: defenses; Chapter 672, Statutes of 2025 (adds Cal. Civ. Code § 1714.46)"
  container: "Chaptered bill text from the Legislative Counsel's PUBINFO database (bill-version record 20250AB__031695CHP). Read in a copy of the PUBINFO export dated 9 July 2026 in GitHub repo aaronjuar-ez/PUBINFO-2025, BILL_VERSION_TBL_9521.lob (commit 7158ec8). Official: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB316 (blocked here)."
  publisher: "California Legislative Counsel"
  date: "2025-10-13"
  url: "https://raw.githubusercontent.com/aaronjuar-ez/PUBINFO-2025/7158ec80e6872dc4a5c45fb634dc77effc0b474e/BILL_VERSION_TBL_9521.lob"
  accessed: "2026-09-29"
  verified: fetched
  claims:
  - claim: "AB 316 adds Section 1714.46 to the Civil Code."
    quote: "An act to add Section 1714.46 to the Civil Code, relating to civil actions."
  - claim: "Legislative Counsel's digest: the bill bars a defendant who developed, modified or used AI from asserting that the AI autonomously caused the harm."
    quote: "This bill would prohibit a defendant who developed, modified, or used artificial intelligence, as defined, from asserting a defense that the artificial intelligence autonomously caused the harm to the plaintiff."
  - claim: "Scope of § 1714.46(b): actions against a defendant who developed, modified or used AI that allegedly harmed the plaintiff."
    quote: "In an action against a defendant who developed, modified, or used artificial intelligence that is alleged to have caused a harm to the plaintiff,"
  - claim: "Operative rule of § 1714.46(b): in such an action it is not a defense, and the defendant may not assert, that the AI autonomously caused the harm."
    quote: "it shall not be a defense, and the defendant may not assert, that the artificial intelligence autonomously caused the harm to the plaintiff."
  - claim: "§ 1714.46(c)(1): other affirmative defenses, including causation and foreseeability evidence, remain available."
    quote: "Any other affirmative defense, including evidence relevant to causation or foreseeability."
  - claim: "§ 1714.46(c)(2): evidence of other persons' comparative fault remains available."
    quote: "Other evidence relevant to the comparative fault of any other person or entity."
  - claim: "§ 1714.46(a) defines 'artificial intelligence'."
    quote: "“Artificial intelligence” means an engineered or machine-based system that varies in its level of autonomy and that can, for explicit or implicit objectives, infer from the input it receives how to generate outputs that can influence physical or virtual environments."
  - claim: "The bill's author is Assembly Member Krell."
    quote: "Introduced by Assembly Member Krell"
  notes: "PUBINFO is the Legislative Counsel's bulk data; this is a third-party upload of the 2026-07-09 export (its README names leginfo.legislature.ca.gov as the source). The record's flags are Urgency NO and ImmediateEffect NO, so the ordinary 1 January start applies (see ca_civ_1714_46_history_pubinfo). The record's action dates are ENROLLED 2025-09-11 and CHAPTERED, APPROVED and FILED 2025-10-13. AB 316 does not create strict liability: subdivision (c) keeps causation, foreseeability and comparative-fault arguments."

