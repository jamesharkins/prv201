- key: ftc_keep_ai_claims_in_check_2023
  type: web
  authors: ["Michael Atleson"]
  title: "Keep your AI claims in check"
  container: "FTC Business Blog (Division of Advertising Practices). ftc.gov is blocked here; the sentence below appeared verbatim in web-search result text, and two GitHub-hosted third-party copies quote it identically (see notes)."
  publisher: "Federal Trade Commission"
  date: "2023-02-27"
  url: "https://www.ftc.gov/business-guidance/blog/2023/02/keep-your-ai-claims-check"
  accessed: "2026-09-29"
  verified: search_snippet_only
  claims:
  - claim: "FTC staff guidance: claims about what an AI product can do are deceptive if they lack scientific support or hold only for some users or conditions."
    quote: "Your performance claims would be deceptive if they lack scientific support or if they apply only to certain types of users or under certain conditions."
  notes: "Corroborating copies (fetched): (1) a research note, TanmaySangam18/competitor-inc, docs/research/THE-MAXIMAL-CLAIM.md (commit 5816665), which says it read the post via the Internet Archive and gives author and date; (2) an Epoch Times article of 2023-03-03 as scraped in aemooooon/puppeteer-scraping (data/EpochTimes/articles/2023-03-03_FTC_Warns_Tech_Companies_to_Keep_AI_Claims_in_Check.txt). STATUS CAVEAT: the research note claims the live ftc.gov URL now returns 404, which is unverified. Search results report that the FTC removed over 300 Khan-era blog posts in 2025 and three AI posts in October 2025; this post was not named. Its current status could not be checked. It is staff business guidance, not a Commission rule. Cite it as 2023 FTC staff guidance and pair it with a current enforcement action (ftc_workado_final_order_2025)."

