# sources_regulation.yaml -- Differential (PRV 201) evidence base: regulation, safety, ethics, governance
# Compiled 2026-09-28. Status statements are "as of 28 September 2026".
#
# VERIFICATION CONVENTIONS (read before citing)
# - verified: fetched
#     The research agent opened the text at `url` and copied the quote from it. The sandbox egress
#     proxy blocked almost every official host (EUR-Lex, eCFR/OSHA, NIST, FTC, state legislatures,
#     SEP, publishers). Some primary texts were therefore opened through GitHub-hosted reproductions
#     of the official text. Those entries say so in `container`/`publisher`; re-check them against
#     the official source before final submission.
# - verified: search_snippet_only
#     The official page was blocked (EGRESS_BLOCKED). The quote reproduces wording shown in
#     web-search result text for that page. Queries were restricted to the official domain where
#     possible. Search-result text can be abridged or lightly normalised, so confirm the exact
#     wording on the official page before quoting it verbatim in the final report.
# - Each claim is limited to what its quote supports. Interpretation for Differential lives in
#   regulation_notes.md. Every quote is <= 40 words.
# - Nothing here is invented. Topics that could not be verified (IEEE/NSPE codes, NFPA 70E,
#   IEC 61010-1, IEC 62368-1, CCPA/CPRA, NISTIR 8280, AI Liability Directive withdrawal, SEP
#   entries, Acemoglu & Restrepo, Brynjolfsson et al., SAE's own J3016 page) are listed as gaps in
#   regulation_notes.md and are deliberately absent from this file.

