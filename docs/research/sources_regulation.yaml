  claims:
    - claim: "The Digital Omnibus on AI was adopted as Regulation (EU) 2026/1744 of 8 July 2026. It amends the AI Act, Regulation (EU) 2018/1139 and the Machinery Regulation (EU) 2023/1230."
      quote: "amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230 as regards the simplification of the implementation of harmonised rules on artificial intelligence (Digital Omnibus on AI)"
    - claim: "The act was signed on 8 July 2026."
