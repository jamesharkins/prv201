- key: goldwasser_audio_repair_notes_1996
  type: web
  authors: ["Samuel M. Goldwasser"]
  title: "Notes on Repair of Audio Equipment and Other Miscellaneous Stuff"
  container: "sci.electronics.repair FAQ, 1996 edition (copyright 1994-1996). Read in the AmigaGuide conversion by Mike Fuller (26 July 1996) archived in GitHub repo AmigaTextFiles/docs, hyper/ER_2/Audio-Repair.guide (commit a45db37). The current edition, 'Notes on the Troubleshooting and Repair of Audio Equipment and Other Miscellaneous Stuff', is at https://www.repairfaq.org/sam/audiofaq.htm (blocked here)."
  publisher: "Samuel M. Goldwasser (sci.electronics.repair FAQ)"
  date: "1996"
  url: "https://raw.githubusercontent.com/AmigaTextFiles/docs/a45db37554254e7f13f926031c9638544b22385f/hyper/ER_2/Audio-Repair.guide"
  accessed: "2026-09-29"
  verified: fetched
  claims:
  - claim: "Goldwasser names a DMM or VOM as the necessary basic meter."
    quote: "A DMM or VOM is necessary for checking of power supply voltages and testing of sensors, LEDs, switches, and other small components."
  - claim: "He calls an inexpensive dual-trace oscilloscope very handy."
    quote: "However, a relatively inexpensive 5 or 10 MHz dual trace scope is very handy and you will find all kinds of uses for it."
  - claim: "For audio work he lists a signal source; an audio signal generator is useful but not essential."
    quote: "Stereo tuner or other audio signal source. An audio signal generator is nice but not really essential."
  - claim: "He recommends an amplifier-based signal tracer to find where a signal is lost."
    quote: "This is useful for tracing an audio circuit to determine where a signal is getting lost. Inexpensive signal tracers are also available but this option is likely free."
  - claim: "He suggests a series light bulb as a current limiter when powering up a faulty supply."
    quote: "The use of a series current limiting resistor - a low wattage light bulb, for example - may be useful to allow you to make measurements without undo risk of damage and an unlimited supply of fuses."
  - claim: "He warns that a Variac is not an isolation transformer."
    quote: "A Variac(tm) is not an isolation transformer!"
  - claim: "With stereo amplifiers he treats the working channel as the reference, swapping parts between the working and dead channels (if the output is not shorted)."
    quote: "With stereo amplifiers, it is normally safe - and most effective - to swap components between the working and dead channels as long as you are sure there is no short circuit on the output."
  - claim: "He contrasts what intermediate test points look like in a working channel and in a dead channel."
    quote: "Intermediate signals in a working channel may look like power supply ripple and noise. In a dead channel these same points may appear to be normal or highly distorted audio depending on which stage you test."
  - claim: "Tests are done unpowered where possible; for example, semiconductors can be checked for shorts with an ohmmeter."
    quote: "Perform as many tests as possible with power off and the equipment unplugged. For example, the semiconductors in the power supply section of a TV or monitor can be tested for short circuits with an ohmmeter."
  - claim: "Before touching circuits with power off, large filter capacitors are discharged through a resistor."
    quote: "If you need to probe, solder, or otherwise touch circuits with power off, discharge (across) large power supply filter capacitors with a 2 W or greater resistor of 100-500 ohms/V approximate value"
  - claim: "The absence of residual charge is then verified with a voltmeter."
    quote: "Monitor while discharging and/or verify that there is no residual charge with a suitable voltmeter."
  notes: "This is the 1996 edition; the wording of the current repairfaq.org edition may differ. It is a widely used technician's FAQ, not a peer-reviewed text. 'undo' in the series-lamp sentence is [sic]. This edition has no sentence that explicitly says 'compare DC voltages with the good channel'. The safety quotes come from its section 3.2 'Safety guidelines'."

