  claims:
  - claim: The library states it was developed by Norman Koren and cites the Glass Audio article (Vol. 8, No. 5, 1996).
    quote: This library was developed by Norman Koren.
  - claim: Glass Audio citation as printed in the library header.
    quote: for SPICE simulations," Glass Audio, Vol. 8, No. 5, 1996,
  - claim: 12AX7 'NEW MODEL' subcircuit node order is plate, grid, cathode.
    quote: .SUBCKT 12AX7 1 2 3  ; P G C;  NEW MODEL
  - claim: 'Published 12AX7 parameters (new model): MU=100, EX=1.4, KG1=1060, KP=600, KVB=300, RGI=2000 ohm; no VCT parameter
      in the original.'
    quote: '+ PARAMS: MU=100 EX=1.4 KG1=1060 KP=600 KVB=300 RGI=2000'
  - claim: 'Published 12AX7 inter-electrode capacitances: CCG=2.3 pF, CGP=2.4 pF, CCP=0.9 pF (comment: add 0.7 pF to adjacent
      pins, 0.5 pF to others).'
    quote: + CCG=2.3P  CGP=2.4P CCP=.9P  ; ADD .7PF TO ADJACENT PINS; .5 TO OTHERS.
  - claim: 'E1 behavioural source (SPICE form of the Koren equation): E1 = V(P,K)/KP * ln(1 + exp(KP*(1/MU + V(G,K)/sqrt(KVB
      + V(P,K)^2)))).'
    quote: +{V(1,3)/KP*LOG(1+EXP(KP*(1/MU+V(2,3)/SQRT(KVB+V(1,3)*V(1,3)))))}
  - claim: 'Plate current source: Ip = (PWR(E1,EX) + PWRS(E1,EX))/KG1, i.e. 2*E1^EX/KG1 for E1>0 and 0 for E1<0 (PSpice PWR=|x|^y,
      PWRS=sgn(x)|x|^y).'
    quote: G1 1 3 VALUE={(PWR(V(7),EX)+PWRS(V(7),EX))/KG1}
  - claim: Grid current is modelled by a diode DX from an internal node to the cathode in series with RGI from the grid.
    quote: D3 5 3 DX     ; FOR GRID CURRENT
  - claim: Series grid-current resistor RGI.
    quote: R1 2 5 {RGI}  ; FOR GRID CURRENT
  - claim: Grid-current diode model card.
    quote: .MODEL DX D(IS=1N RS=1 CJO=10PF TT=1N)
  - claim: A 1 Gohm plate-cathode resistor is included to avoid floating nodes (mu-follower).
    quote: RCP 1 3 1G    ; TO AVOID FLOATING NODES IN MU-FOLLOWER
  - claim: The superseded 'OLD MODEL' 12AX7 parameters (commented out) were MU=93, EX=1.5, KG1=1360, KP=10000, KVB=0.
    quote: '* + PARAMS: MU=93 EX=1.5 KG1=1360 KP=10000 KVB=0 RGI=2000'
