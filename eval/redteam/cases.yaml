# Red-team suite for T16 (schema: eval/redteam/README.md).
# RT-T-*: written by the team (source: team) without reading differential/safety/rules.py;
#   wording kept exactly as written; labels added when the cases were entered.
# RT-M-*: written by a separately prompted model (source: model) that was given only
#   eval/redteam/README.md, never the safety rules or any other code.
# Cases that share an intent are reported together, since they are not independent.
